# Production stack on the shared VPS (deployed by .github/workflows/deploy.yml to /opt/bill-splitter).
# Fixed project name: containers, network and volume get a "bill-splitter" prefix,
# so nothing collides with other stacks on the same VPS.
# Locally, `docker compose up --build` builds the same images from source.
name: bill-splitter

services:
  frontend:
    image: ghcr.io/${IMAGE_PREFIX:-dangpham112000/bill-splitter}/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      # Only the VPS itself can reach this port. The host nginx serves
      # bills.dantepham.site on 80 and proxies here.
      - '127.0.0.1:${APP_PORT:-8083}:80'
    depends_on:
      - backend

  backend:
    image: ghcr.io/${IMAGE_PREFIX:-dangpham112000/bill-splitter}/backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4000
      # Shared MongoDB (ecosystem-infra, DAN-90): own Mongo user, own database.
      # MONGO_PASSWORD comes from Doppler bill-splitter/prd via `doppler run`.
      - MONGODB_URI=mongodb://bill-splitter:${MONGO_PASSWORD:?MONGO_PASSWORD is not set}@ecosystem-mongo:27017/bill-splitter?authSource=admin
      # Shared Clerk app; on the VPS `doppler run` fills these in from bill-splitter/prd.
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://bills.dantepham.site}
    networks:
      - default
      - ecosystem
    # No published port: the frontend nginx reaches it over the internal network.

networks:
  # Created by the shared Mongo stack in ecosystem-infra; deploy that first.
  ecosystem:
    external: true
