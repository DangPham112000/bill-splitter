name: Deploy to VPS

# Pushing to main deploys to production at https://bills.dantepham.site.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# GitHub keeps a single secret, DOPPLER_TOKEN (read-only service token for bill-splitter/prd).
# Everything else comes from Doppler, where it can be read again when needed. GHCR uses the
# job's own GITHUB_TOKEN, so there is no personal access token.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [backend, frontend]
    concurrency:
      group: build-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The publishable key lives in Doppler (project bill-splitter, config prd) as a reference
      # to the shared Clerk app. `doppler secrets get` fails the job if the token or the key is
      # missing, so a frontend without sign-in never ships.
      - name: Install Doppler CLI
        if: matrix.service == 'frontend'
        uses: dopplerhq/cli-action@v3

      - name: Load build-time keys from Doppler
        if: matrix.service == 'frontend'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::Set the DOPPLER_TOKEN repository secret (a read-only service token for bill-splitter/prd)."
            exit 1
          fi
          # Doppler keeps one variable that references the shared app; the build gets it under
          # its VITE_ name. A VITE_ copy in Doppler would be a chained reference, which Doppler
          # does not allow.
          KEY=$(doppler secrets get CLERK_PUBLISHABLE_KEY --plain)
          echo "VITE_CLERK_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          # Empty for the backend. The publishable key is public; Vite inlines it.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # VPS_HOST, VPS_USERNAME and VPS_SSH_KEY reference the same values in Doppler shared/prd
      # for every app. They are masked in the logs.
      - name: Load deploy secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            value=$(doppler secrets get "$name" --plain)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in Doppler bill-splitter/prd."
              exit 1
            fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$value"
            { echo "$name<<__DOPPLER_EOF__"; echo "$value"; echo "__DOPPLER_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          source: 'docker-compose.yml'
          target: '/opt/bill-splitter'

      - name: Deploy and restart services on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            set -e
            cd /opt/bill-splitter

            # Image names on GHCR must be lowercase.
            export IMAGE_PREFIX=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            # Keep registry credentials in this project only, so the login does not
            # overwrite the docker config other stacks on the VPS rely on.
            export DOCKER_CONFIG=/opt/bill-splitter/.docker
            mkdir -p "$DOCKER_CONFIG"
            # The job's GITHUB_TOKEN can read this repo's packages and stops working when the
            # job ends, so no long-lived registry token is kept on the VPS.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Runtime secrets come from Doppler. The deploy user has a read-only service token
            # scoped to /opt/bill-splitter. Stop here if it is missing, rather than starting a
            # backend without its Clerk key.
            if ! doppler secrets get CLERK_SECRET_KEY --plain > /dev/null; then
              echo "Doppler is not set up for /opt/bill-splitter on this VPS user." >&2
              exit 1
            fi

            docker compose pull
            doppler run -- docker compose up -d --remove-orphans
            docker image prune -f
