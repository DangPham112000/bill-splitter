server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, so the proxy survives the backend container being recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:4000;

    root /usr/share/nginx/html;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Join links (DAN-36). Zalo and Messenger don't run JavaScript, so index.html is served with
    # SSI on: its <!--# include --> pulls the splitter's link preview tags from the backend.
    # Everywhere else that comment stays a plain HTML comment.
    location ~ "^/join/(?<invite_token>[A-Za-z0-9_-]{1,64})/?$" {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Only reachable from the SSI include above.
    location /link-preview/ {
        internal;
        proxy_pass $backend$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # If the backend is down, the page loads without preview tags instead of a 502 page.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @no_preview;
    }

    location @no_preview {
        return 204;
    }

    location ~ ^/(graphql|health)$ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
